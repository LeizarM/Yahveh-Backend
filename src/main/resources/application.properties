# === CORS ===
# En DEV (quarkus dev) se permite cualquier origen para no estorbar el desarrollo local.
# En PROD (jar empaquetado) se RESTRINGE al/los dominio(s) reales via variable de entorno CORS_ORIGINS,
# ej: CORS_ORIGINS=https://app.tucliente.com  (separar con comas si hay varios).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=false

quarkus.native.additional-build-args=-H:-UseContainerSupport